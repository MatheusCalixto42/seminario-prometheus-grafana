version: '3.8'

services:
  # Nossa API Flask
  app:
    build: ./app
    container_name: flask-app
    ports:
      - "5000:5000"
    restart: always
  # Agente de métricas do Host / Sistema Operacional
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    restart: always
  # Servidor de Coleta e Armazenamento (TSDB)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: always

# --Comentários sobre o arquivo--

# - volumes: Mapeamos o arquivo local ./prometheus/prometheus.yml diretamente para dentro do contêiner em /etc/prometheus/prometheus.yml.
# - As portas expostas no host (5000, 9100, 9090) permitem que você acesse tanto a API quanto as interfaces web do Prometheus e do Node Exporter pelo navegador da sua máquina.