version: '3.8'

services:
  # 1. API do E-commerce NetShop (Camada 7)
  app:
    build: ./app
    container_name: flask-app
    ports:
      - "5000:5000"
    restart: always

  # 2. Agente de métricas do Host / Sistema Operacional (Camadas 2/3/4)
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    restart: always

  # 3. Servidor de Coleta e Armazenamento (TSDB)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: always

  # 4. Central de Tratamento e Despacho de Alertas
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    restart: always

  # 5. Gerador de Tráfego Orgânico (Simula vários clientes navegando e comprando 24/7)
  load-generator:
    image: curlimages/curl:latest
    container_name: load-generator
    restart: always
    depends_on:
      - app
    environment:
      - USUARIOS=5  # Quantidade de clientes simultâneos
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cliente() {
          while true; do
            curl -s --max-time 5 http://app:5000/produtos > /dev/null
            sleep 0.5
            curl -s --max-time 5 http://app:5000/produtos > /dev/null
            sleep 0.5
            curl -s --max-time 5 -X POST http://app:5000/login -d '{"usuario":"cliente","senha":"cliente123"}' > /dev/null
            sleep 0.5
            curl -s --max-time 5 http://app:5000/produtos > /dev/null
            sleep 0.5
            curl -s --max-time 5 -X POST http://app:5000/checkout > /dev/null
            sleep 1
          done
        }
        for i in $$(seq 1 $$USUARIOS); do
          cliente &
          sleep 0.7
        done
        wait

  # 6. Visualização e Dashboards (consulta o Prometheus via PromQL)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: always

# Volumes persistentes para não perder o histórico de métricas e os dados do Grafana ao reiniciar contêineres
volumes:
  prometheus_data:
  grafana_data:

# --Comentários sobre o arquivo--

# - volumes: Mapeamos o arquivo local ./prometheus/prometheus.yml diretamente para dentro do contêiner em /etc/prometheus/prometheus.yml.
# - As portas expostas no host (5000, 9100, 9090, 9093, 3000) permitem que você acesse a API e as interfaces web do Node Exporter, do Prometheus, do Alertmanager e do Grafana pelo navegador da sua máquina.