version: '3.8'

services:
  # 1. API do E-commerce NetShop (Camada 7)
  app:
    build: ./app
    container_name: flask-app
    ports:
      - "5000:5000"
    restart: always

  # 2. Agente de métricas do Host / Sistema Operacional (Camadas 2/3/4)
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    restart: always

  # 3. Servidor de Coleta e Armazenamento (TSDB)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: always

  # 4. Central de Tratamento e Despacho de Alertas
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    restart: always

  # 5. Gerador de Tráfego Orgânico (Simula clientes navegando e comprando 24/7)
  load-generator:
    image: curlimages/curl:latest
    container_name: load-generator
    restart: always
    depends_on:
      - app
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          curl -s --max-time 5 http://app:5000/produtos > /dev/null
          sleep 0.5
          curl -s --max-time 5 http://app:5000/produtos > /dev/null
          sleep 0.5
          curl -s --max-time 5 -X POST http://app:5000/login -d '{"usuario":"cliente","senha":"cliente123"}' > /dev/null
          sleep 0.5
          curl -s --max-time 5 http://app:5000/produtos > /dev/null
          sleep 0.5
          curl -s --max-time 5 -X POST http://app:5000/checkout > /dev/null
          sleep 1
        done

# Volume persistente para não perder o histórico de métricas ao reiniciar contêineres
volumes:
  prometheus_data:

# --Comentários sobre o arquivo--

# - volumes: Mapeamos o arquivo local ./prometheus/prometheus.yml diretamente para dentro do contêiner em /etc/prometheus/prometheus.yml.
# - As portas expostas no host (5000, 9100, 9090) permitem que você acesse tanto a API quanto as interfaces web do Prometheus e do Node Exporter pelo navegador da sua máquina.